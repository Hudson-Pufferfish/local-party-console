version: 2
updates:
  # Maintain dependencies for pnpm monorepo packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
